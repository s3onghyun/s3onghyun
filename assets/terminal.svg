<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Seonghyun Hong's animated terminal profile</title>
  <desc id="desc">A terminal types an introduction, engineering focus, and a neofetch-style profile beside an ASCII portrait.</desc>
  <style>
    .shell { fill: #0d1117; stroke: #30363d; stroke-width: 2; } .bar { fill: #161b22; }
    .red { fill: #ff5f56; } .yellow { fill: #ffbd2e; } .green { fill: #27c93f; }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 18px; }
    .small { font-size: 12px; } .prompt { fill: #7ee787; } .command { fill: #f0f6fc; } .muted { fill: #8b949e; }
    .accent { fill: #58a6ff; } .violet { fill: #d2a8ff; } .warm { fill: #ffa657; }
    .scene { opacity: 0; animation: scene 18s infinite; } .whoami { opacity: 1; } .focus { animation-delay: 4s; } .fetch { animation-delay: 8s; }
    .typed { clip-path: inset(0 100% 0 0); animation: typing 1.15s steps(20, end) forwards; }
    .line { opacity: 0; animation: line-in .35s ease-out forwards; } .whoami .line-a { animation-delay: 1.1s; } .whoami .line-b { animation-delay: 1.55s; }
    .focus .typed { animation-delay: 4s; } .focus .line-a { animation-delay: 5.05s; } .focus .line-b { animation-delay: 5.38s; } .focus .line-c { animation-delay: 5.71s; }
    .fetch .typed { animation-delay: 8s; } .fetch .portrait, .fetch .facts { opacity: 0; animation: line-in .5s ease-out 9.1s forwards; }
    .cursor { fill: #7ee787; animation: blink .9s step-end infinite; }
    @keyframes scene { 0%, 20% { opacity: 1; } 22.3%, 100% { opacity: 0; } }
    @keyframes typing { to { clip-path: inset(0 0 0 0); } } @keyframes line-in { to { opacity: 1; } } @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .scene, .typed, .line, .fetch .portrait, .fetch .facts { animation: none; } .whoami { opacity: 1; } .whoami .typed, .whoami .line { opacity: 1; clip-path: none; } .cursor { animation: none; } }
  </style>
  <rect class="shell" x="1" y="1" width="1118" height="618" rx="12" />
  <path class="bar" d="M13 2h1094a11 11 0 0 1 11 11v42H2V13A11 11 0 0 1 13 2Z" />
  <circle class="red" cx="28" cy="28" r="7"/><circle class="yellow" cx="51" cy="28" r="7"/><circle class="green" cx="74" cy="28" r="7"/>
  <text class="muted" x="560" y="35" text-anchor="middle">joshua@github: ~/profile</text>

  <g class="scene whoami">
    <text class="prompt" x="42" y="108">$</text><text class="command typed" x="68" y="108">whoami</text>
    <text class="accent line line-a" x="42" y="154">Seonghyun (Joshua) Hong</text><text class="muted line line-a" x="322" y="154"> — platform / DevOps engineer</text>
    <text class="muted line line-b" x="42" y="192">I build calm paths through complex infrastructure.</text>
    <text class="prompt" x="42" y="248">$</text><rect class="cursor" x="67" y="230" width="11" height="22" />
  </g>

  <g class="scene focus">
    <text class="prompt" x="42" y="108">$</text><text class="command typed" x="68" y="108">cat focus</text>
    <text class="warm line line-a" x="42" y="158">01</text><text class="muted line line-a" x="90" y="158">GitLab platform and CI/CD</text>
    <text class="warm line line-b" x="42" y="196">02</text><text class="muted line line-b" x="90" y="196">Observability architecture</text>
    <text class="warm line line-c" x="42" y="234">03</text><text class="muted line line-c" x="90" y="234">Kubernetes and cloud-native open source</text>
    <text class="prompt" x="42" y="290">$</text><rect class="cursor" x="67" y="272" width="11" height="22" />
  </g>

  <g class="scene fetch">
    <text class="prompt" x="42" y="92">$</text><text class="command typed" x="68" y="92">neofetch --profile</text>
