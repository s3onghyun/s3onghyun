    </g>
    <g class="facts">
      <text class="accent" x="490" y="148">SEONGHYUN HONG</text>
      <path stroke="#30363d" x1="490" y1="165" x2="1030" y2="165" />
      <text class="violet" x="490" y="202">role</text><text class="muted" x="620" y="202">Platform / DevOps engineer</text>
      <text class="violet" x="490" y="240">stack</text><text class="muted" x="620" y="240">GitLab · Kubernetes · Prometheus</text>
      <text class="violet" x="490" y="266"> </text><text class="muted" x="620" y="266">Grafana · OpenTelemetry</text>
      <text class="violet" x="490" y="304">editor</text><text class="muted" x="620" y="304">neovim</text>
      <text class="violet" x="490" y="342">blog</text><text class="accent" x="620" y="342">s3onghyun.github.io</text>
      <text class="prompt" x="490" y="414">$</text><text class="command" x="516" y="414">git log --oneline --all</text><rect class="cursor" x="794" y="396" width="11" height="22" />
    </g>
  </g>
</svg>
